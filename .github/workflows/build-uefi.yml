# Project Mu UEFI for Apple silicon — GitHub Actions 构建
# 产物：Actions run 页面底部 Artifacts 里的 uefi-firmware.zip（含 .fd）
name: build-uefi

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '要构建的平台包'
        type: choice
        required: true
        default: MacBookAirMid2020Pkg
        options:
          - MacBookAirMid2020Pkg
          - MacBookProLate2020Pkg
          - MacMini2020Pkg
          - MacBookProEarly2023Pkg
          - MacStudio2022Pkg
          - all
      target:
        description: '构建类型'
        type: choice
        required: true
        default: DEBUG
        options:
          - DEBUG
          - RELEASE
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-uefi.yml'

permissions:
  contents: read

env:
  PLATFORM: ${{ inputs.platform || 'MacBookAirMid2020Pkg' }}
  BUILD_TARGET: ${{ inputs.target || 'DEBUG' }}

jobs:
  build:
    name: UEFI (${{ inputs.platform || 'MacBookAirMid2020Pkg' }} / ${{ inputs.target || 'DEBUG' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm uuid-dev git ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            acpica-tools

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pip-requirements.txt') }}
          restore-keys: pip-

      - name: 创建 venv 并安装 stuart
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install --upgrade -r pip-requirements.txt
          command -v stuart_setup > /dev/null && echo "stuart OK ($(stuart_setup --version 2>/dev/null || echo available))"

      - name: 导出工具链环境变量
        run: |
          LLVM_BIN="$(ls -d /usr/lib/llvm-*/bin 2>/dev/null | head -1)"
          echo "CLANGPDB_BIN=${LLVM_BIN}/" >> "$GITHUB_ENV"
          echo "CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "GCC_AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "GCC5_AARCH64_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          echo "使用 LLVM: ${LLVM_BIN}"
          "${LLVM_BIN}/clang" --version | head -2

      - name: 展开平台列表
        id: plats
        run: |
          if [ "$PLATFORM" = "all" ]; then
            LIST="MacBookAirMid2020Pkg MacBookProLate2020Pkg MacMini2020Pkg MacBookProEarly2023Pkg MacStudio2022Pkg"
          else
            LIST="$PLATFORM"
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "将构建: $LIST"

      - name: 拉取 Mu 子模块（stuart_setup）
        run: |
          source venv/bin/activate
          for P in ${{ steps.plats.outputs.list }}; do
            echo "::group::setup $P"
            stuart_setup -c "Platform/$P/PlatformBuild.py" \
              TOOL_CHAIN_TAG=CLANGPDB TARGET=$BUILD_TARGET
            echo "::endgroup::"
          done

      - name: stuart_update
        run: |
          source venv/bin/activate
          for P in ${{ steps.plats.outputs.list }}; do
            echo "::group::update $P"
            stuart_update -c "Platform/$P/PlatformBuild.py" \
              TOOL_CHAIN_TAG=CLANGPDB TARGET=$BUILD_TARGET
            echo "::endgroup::"
          done

      - name: stuart_build
        id: build
        continue-on-error: true
        run: |
          source venv/bin/activate
          FAILED=""
          for P in ${{ steps.plats.outputs.list }}; do
            echo "::group::build $P"
            if stuart_build -c "Platform/$P/PlatformBuild.py" \
                 TOOL_CHAIN_TAG=CLANGPDB TARGET=$BUILD_TARGET; then
              echo "$P OK"
            else
              echo "::error::$P 构建失败"
              FAILED="$FAILED $P"
            fi
            echo "::endgroup::"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          [ -z "$FAILED" ]

      - name: 收集固件
        if: always()
        run: |
          mkdir -p dist
          for P in ${{ steps.plats.outputs.list }}; do
            OUT="Build/$P-AARCH64/${BUILD_TARGET}_CLANGPDB"
            echo "--- $P -> $OUT"
            if [ -d "$OUT" ]; then
              find "$OUT" -type f \( -name '*.fd' -o -name '*.Fv' -o -name '*.fv' \) \
                -exec cp {} dist/ \; 2>/dev/null
            fi
          done
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            ls -lh dist
            echo '| 文件 | 大小 |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
            for f in dist/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "没有找到 .fd 文件，请查看上面的构建日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ACPI 表校验（软检查）
        if: always()
        continue-on-error: true
        run: |
          for P in ${{ steps.plats.outputs.list }}; do
            OUT="Build/$P-AARCH64/${BUILD_TARGET}_CLANGPDB"
            find "$OUT" -name '*.aml' 2>/dev/null | head -5 | while read -r f; do
              echo "== $f"
              iasl -d "$f" 2>&1 | tail -4
            done
          done

      - name: 上传固件
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: uefi-firmware-${{ inputs.target || 'DEBUG' }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            Build/BUILDLOG.txt
            Build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
